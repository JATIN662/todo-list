<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>TO DO LIST</h1>
        <p class="subtitle">Organise your tasks. Stay productive</p>

        <!-- Search -->
        <div class="search-container">
            <input
                type="search"
                id="search-input"
                placeholder="Search tasks..."
            >
        </div>

        <!-- Add Task -->
        <div class="input-container">
            <input
                type="text"
                id="task-input"
                placeholder="Enter your task"
            >

            <button id="add-btn">ADD TASK</button>
        </div>

        <!-- Filters -->
        <div class="filter">
            <p class="active" data-filter="all">ALL</p>
            <p data-filter="pending">PENDING</p>
            <p data-filter="completed">COMPLETED</p>
        </div>

        <!-- Tasks -->
        <div class="task-container"></div>

        <!-- Task Stats -->
        <div class="stats">
            <span>Total: <b id="total-count">0</b></span>
            <span>Completed: <b id="completed-count">0</b></span>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
